<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 13px/1.4 system-ui, sans-serif;
      width: 420px;
      margin: 0;
      padding: 12px;
    }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: block; font-weight: 600; margin: 8px 0 3px; }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font: inherit;
    }
    .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
    .row.opts label { font-weight: 400; margin: 0; display: flex; align-items: center; gap: 4px; }
    button {
      padding: 6px 12px;
      font: inherit;
      cursor: pointer;
    }
    button.primary { font-weight: 600; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 200px;
      font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
      padding: 8px;
      resize: vertical;
      white-space: pre;
    }
    #status { font-size: 12px; opacity: 0.75; min-height: 16px; margin-top: 6px; }
    .hint { font-size: 11px; opacity: 0.65; margin: 2px 0 0; }
  </style>
</head>
<body>
  <h1>🍪 Cookie Dumper</h1>

  <label for="pattern">Site pattern</label>
  <input type="text" id="pattern" placeholder="example.com  or  https://app.example.com" />
  <p class="hint">A bare domain matches that host and its subdomains. A full URL matches that exact origin/path.</p>

  <div class="row opts">
    <label><input type="checkbox" id="upper" checked /> UPPER_SNAKE keys</label>
    <label><input type="checkbox" id="quote" checked /> Quote values</label>
    <label>Prefix <input type="text" id="prefix" style="width:90px" placeholder="(none)" /></label>
  </div>

  <div class="row">
    <button id="dump" class="primary">Dump cookies</button>
    <button id="copy">Copy</button>
    <button id="download">Download .env</button>
  </div>

  <textarea id="output" spellcheck="false" placeholder="# .env output appears here"></textarea>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
